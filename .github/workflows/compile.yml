name: AppDockCompiler
run-name: "AppDockCompiler · ${{ inputs.request_id || 'smoke' }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique build request UUID
        type: string
        required: true
      project_id:
        description: Trusted, admin-published project
        type: string
        required: true
      board:
        description: Target board key
        type: string
        required: true
      config_b64:
        description: Base64 JSON map of admin-approved variables
        type: string
        required: true
      allow_draft:
        type: boolean
        required: false
        default: false
      revision:
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/compile.yml'
      - 'scripts/prepare.py'
      - 'boards/**'
      - 'projects/**'
      - 'scripts/package_firmware.py'
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.inputs.request_id || github.sha }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Validate config; generate C++ header
        env:
          PROJECT_ID: ${{ inputs.project_id || 'led-blink' }}
          BOARD_ID: ${{ inputs.board || 'uno' }}
          CONFIG_B64: ${{ inputs.config_b64 || 'e30=' }}
          ALLOW_DRAFT: ${{ inputs.allow_draft || 'false' }}
        shell: bash
        run: |
          if [[ "${ALLOW_DRAFT:-false}" == "true" ]]; then
            if [[ "${{ github.ref_name }}" != "appdock-preview" ]]; then echo 'Draft builds only on isolated preview branch'; exit 1; fi
            python3 scripts/prepare.py --project "$PROJECT_ID" --board "$BOARD_ID" --config-b64 "$CONFIG_B64" --allow-draft
          else
            python3 scripts/prepare.py --project "$PROJECT_ID" --board "$BOARD_ID" --config-b64 "$CONFIG_B64"
          fi
      - name: Cache board cores
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: compiler-v1-${{ runner.os }}-${{ inputs.board || 'uno' }}
      - name: Select board core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          x=json.load(open('build/selection.json'))
          for key,value in x.items():
              if key in ('fqbn','core','additional_url'):
                  print(key.upper() + '=' + str(value or ''))
          PY
      - name: Install board core and compile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ADDITIONAL_URL:-}" ]]; then
            arduino-cli core update-index --additional-urls "$ADDITIONAL_URL"
            arduino-cli core install "$CORE" --additional-urls "$ADDITIONAL_URL"
          else
            arduino-cli core update-index
            arduino-cli core install "$CORE"
          fi
          mkdir -p build/output
          python3 - <<'PY'
          import json, subprocess
          for lib in json.load(open('build/selection.json')).get('libraries', []):
              print('Installing library:', lib)
              subprocess.run(['arduino-cli','lib','install',lib],check=True,timeout=180)
          PY
          arduino-cli compile --fqbn "$FQBN" --output-dir build/output --warnings default build/AppDockSketch
      - name: Package board-specific firmware and flash offsets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_firmware.py
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdock-firmware-${{ inputs.request_id || 'smoke' }}
          path: build/artifact
          retention-days: 7
          if-no-files-found: error

  compatibility-smoke:
    name: Smoke ${{ matrix.board }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: leonardo, core: arduino:avr, fqbn: 'arduino:avr:leonardo', url: ''}
          - {board: nano_every, core: arduino:megaavr, fqbn: 'arduino:megaavr:nona4809', url: ''}
          - {board: uno_r4_minima, core: arduino:renesas_uno, fqbn: 'arduino:renesas_uno:minima', url: ''}
          - {board: pico2, core: rp2040:rp2040, fqbn: 'rp2040:rp2040:rpipico2', url: 'https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json'}
          - {board: due_programming, core: arduino:sam, fqbn: 'arduino:sam:arduino_due_x_dbg', url: ''}
    runs-on: ubuntu-22.04
    timeout-minutes: 32
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: smoke-v2-${{ runner.os }}-${{ matrix.core }}
      - name: Compile and validate output
        env:
          BOARD: ${{ matrix.board }}
          CORE: ${{ matrix.core }}
          FQBN: ${{ matrix.fqbn }}
          URL: ${{ matrix.url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$URL" ]]; then
            arduino-cli core update-index --additional-urls "$URL"
            arduino-cli core install "$CORE" --additional-urls "$URL"
          else
            arduino-cli core update-index
            arduino-cli core install "$CORE"
          fi
          mkdir -p build/AppDockSketch build/output
          printf '%s\n' '#include <Arduino.h>' 'void setup() { pinMode(13, OUTPUT); }' 'void loop() { digitalWrite(13, HIGH); delay(500); digitalWrite(13, LOW); delay(500); }' > build/AppDockSketch/AppDockSketch.ino
          arduino-cli compile --fqbn "$FQBN" --output-dir build/output build/AppDockSketch
          python3 - <<'PY'
          import json, os
          with open('build/selection.json','w') as f:
              json.dump({'board':os.environ['BOARD'],'fqbn':os.environ['FQBN'],'core':os.environ['CORE']},f)
          PY
          python3 scripts/package_firmware.py
          ls -lh build/artifact
      - name: Save smoke firmware
        uses: actions/upload-artifact@v4
        with:
          name: appdock-smoke-${{ matrix.board }}
          path: build/artifact/
          retention-days: 3
          if-no-files-found: error
